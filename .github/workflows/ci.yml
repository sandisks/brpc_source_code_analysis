name: build-examples

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake g++ curl \
            libprotobuf-dev protobuf-compiler libprotoc-dev \
            libgflags-dev \
            libssl-dev zlib1g-dev \
            libleveldb-dev libsnappy-dev

      - name: Build brpc 1.17.0
        run: |
          set -e
          mkdir -p /tmp/brpc_src && cd /tmp/brpc_src
          curl -sL --retry 3 -o brpc.tar.gz \
            https://github.com/apache/brpc/archive/refs/tags/1.17.0.tar.gz
          ls -lh brpc.tar.gz
          tar xzf brpc.tar.gz
          cd brpc-1.17.0
          mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/tmp/brpc_ci/usr \
                .. 2>&1 | tee /tmp/brpc_cmake.log
          make -j"$(nproc)" 2>&1 | tee /tmp/brpc_make.log
          make install 2>&1 | tee /tmp/brpc_install.log

      - name: Configure & build examples
        run: |
          cmake -S . -B build \
            -DBRPC_ROOT=/tmp/brpc_ci/usr \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Run examples
        run: |
          BRPC_ROOT=/tmp/brpc_ci/usr bash scripts/run_examples.sh

      - name: Show diagnostics
        if: always()
        run: |
          echo "===== cmake tail ====="
          tail -n 40 /tmp/brpc_cmake.log 2>/dev/null || true
          echo "===== make tail ====="
          tail -n 40 /tmp/brpc_make.log 2>/dev/null || true
          echo "===== run.log tail ====="
          tail -n 20 build_logs/run.log 2>/dev/null || true
